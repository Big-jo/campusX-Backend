# Docker Compose for Scraper Services
# Run with: docker-compose -f docker-compose.scraper.yml up

version: '3.8'

services:
  # Python Celery Worker (scrapes content)
  scraper-worker:
    build:
      context: ../../services/scraper
      dockerfile: Dockerfile
    container_name: campusx-scraper-worker
    command: celery -A src.main worker --loglevel=info --concurrency=2
    environment:
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=redis://redis:6379/1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GCS_PROJECT_ID=${GCS_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      - GCS_SERVICE_ACCOUNT_KEY=${GCS_SERVICE_ACCOUNT_KEY}
      - GCS_PUBLIC_URL=${GCS_PUBLIC_URL}
    volumes:
      - ../../services/scraper:/app
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - campusx-network

  # Python Celery Beat (scheduler)
  scraper-beat:
    build:
      context: ../../services/scraper
      dockerfile: Dockerfile
    container_name: campusx-scraper-beat
    command: celery -A src.main beat --loglevel=info
    environment:
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=redis://redis:6379/1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ../../services/scraper:/app
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - campusx-network

  # MongoDB (if not already running)
  mongo:
    image: mongo:5.0
    container_name: campusx-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=campusx
    volumes:
      - mongo-data:/data/db
    networks:
      - campusx-network

  # Redis (if not already running)
  redis:
    image: redis:7-alpine
    container_name: campusx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - campusx-network

volumes:
  mongo-data:
  redis-data:

networks:
  campusx-network:
    driver: bridge
