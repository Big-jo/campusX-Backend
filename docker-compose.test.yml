services:
  mongodb-test:
    image: mongo:5.0
    container_name: campusx-mongodb-test
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: testpassword
      MONGO_INITDB_DATABASE: campusx_test
      MONGO_URI=mongodb://localhost:27017/campusx_test
    networks:
      - campusx-test-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: campusx-redis-test
    ports:
      - "6379:6379"
    networks:
      - campusx-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  campusx-test-network:
    driver: bridge
