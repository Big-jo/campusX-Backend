version: 2.1

# Define the jobs we want to run for this project
jobs:
    run_tests:
      docker:
        - image: circleci/node:10
        - image: "circleci/mongo:latest"
      steps:
        - checkout
        - run:
            name: Install npm Dependencies
            command: |
              npm install --save
        - run:
            name: Run Unit Tests
            command: |
              npm run tests
              
    pull-and-build:
      docker:
        - image: arvindr226/alpine-ssh
      steps:
        - checkout
        - run: ssh  -oStrictHostKeyChecking=no -v $USER@$IP  "source ~/.nvm/nvm.sh; ./deploy.sh"

# Orchestrate our job run sequence
workflows:
  version: 2
  build-project:
    jobs:
      - pull-and-build:
          filters:
            branches:
              only:
                - master
      - run_tests:
          filters:
            branches:
              only:
                - developement