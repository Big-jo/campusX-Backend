openapi: 3.0.3
info:
  title: CampusX V2 API
  description: CampusX V2 API with fan-out newsfeed and long polling
  version: 2.0.0
servers:
  - url: http://localhost:3001/api/v2
    description: Local development server
  - url: https://api.campusx.com/api/v2
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Post:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439011"
        text:
          type: string
          example: "Hello CampusX!"
        image:
          type: string
          nullable: true
          example: "https://example.com/image.jpg"
        video:
          type: string
          nullable: true
          example: "https://example.com/video.mp4"
        campus:
          type: string
          example: "Stanford University"
        hashTags:
          type: array
          items:
            type: string
          example: ["tech", "campus"]
        likes:
          type: number
          example: 42
        comments:
          type: number
          example: 15
        createdAt:
          type: number
          example: 1699876543210

    PostWithAuthor:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          properties:
            author:
              type: object
              properties:
                _id:
                  type: string
                name:
                  type: string
                userTag:
                  type: string
                userProfile:
                  type: object
                  properties:
                    avatar:
                      type: string
            isLiked:
              type: boolean
              example: false

    CreatePostRequest:
      type: object
      properties:
        text:
          type: string
          example: "My first post"
        image:
          type: string
          nullable: true
        video:
          type: string
          nullable: true
        campus:
          type: string
          example: "Stanford University"
        hashTags:
          type: array
          items:
            type: string
        mentions:
          type: array
          items:
            type: string

    FeedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            posts:
              type: array
              items:
                $ref: '#/components/schemas/PostWithAuthor'
            pagination:
              type: object
              properties:
                page:
                  type: number
                  example: 1
                limit:
                  type: number
                  example: 20
                hasMore:
                  type: boolean
                  example: true
        meta:
          type: object
          properties:
            pollingInterval:
              type: number
              description: Recommended polling interval in seconds
              example: 30
            updates:
              type: number
              description: Number of new updates available
              example: 5

    Error:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: number
        path:
          type: string
        method:
          type: string

security:
  - bearerAuth: []

paths:
  /posts/create:
    post:
      summary: Create a new post
      description: Creates a new post and fans out to followers' timelines
      tags:
        - Posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      post:
                        $ref: '#/components/schemas/Post'
                  message:
                    type: string
                    example: "Post created successfully"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

  /posts/{postId}:
    get:
      summary: Get a single post
      description: Retrieves a post by ID with author information
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      post:
                        $ref: '#/components/schemas/PostWithAuthor'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a post
      description: Deletes a post and removes from all timelines
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post deleted successfully"
        '400':
          description: Not authorized to delete this post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found

  /posts/{postId}/like:
    post:
      summary: Like a post
      description: Adds a like to a post
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post liked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      postId:
                        type: string
                      likes:
                        type: number
                  message:
                    type: string
                    example: "Post liked successfully"
        '400':
          description: Post already liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found

    delete:
      summary: Unlike a post
      description: Removes a like from a post
      tags:
        - Posts
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post unliked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      postId:
                        type: string
                      likes:
                        type: number
                  message:
                    type: string
                    example: "Post unliked successfully"
        '400':
          description: Post not liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post not found

  /posts/newsfeed:
    get:
      summary: Get user newsfeed
      description: Retrieves posts from followed users (fan-out read from Redis timeline)
      tags:
        - Newsfeed
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 20
          example: 20
        - name: page
          in: query
          schema:
            type: number
            default: 1
          example: 1
      responses:
        '200':
          description: Newsfeed retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '401':
          description: Unauthorized

  /posts/newsfeed/poll:
    get:
      summary: Long poll for newsfeed updates
      description: |
        Holds connection open until new posts are available or timeout.
        Client should use the returned `pollingInterval` to control reconnection timing.
      tags:
        - Newsfeed
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: number
          description: Timestamp to check for updates since
          example: 1699876543210
        - name: timeout
          in: query
          schema:
            type: number
            default: 30
          description: Max seconds to hold connection
          example: 30
        - name: limit
          in: query
          schema:
            type: number
            default: 20
          example: 20
      responses:
        '200':
          description: |
            Returns immediately if new posts available, otherwise holds connection until timeout.
            Response includes `meta.pollingInterval` (5s if updates, 30s if no updates) for client to control reconnection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '401':
          description: Unauthorized

  /posts/user/{userId}:
    get:
      summary: Get user's posts
      description: Retrieves all posts by a specific user
      tags:
        - Posts
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
          example: "507f1f77bcf86cd799439011"
        - name: postType
          in: query
          schema:
            type: string
            enum: [all, images, videos]
            default: all
          example: "all"
        - name: page
          in: query
          schema:
            type: number
            default: 1
          example: 1
        - name: limit
          in: query
          schema:
            type: number
            default: 20
          example: 20
      responses:
        '200':
          description: User posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      posts:
                        type: array
                        items:
                          $ref: '#/components/schemas/PostWithAuthor'
                      pagination:
                        type: object
                        properties:
                          page:
                            type: number
                          limit:
                            type: number
                          totalPages:
                            type: number
                          totalDocs:
                            type: number
                          hasNextPage:
                            type: boolean
                          hasPrevPage:
                            type: boolean
        '401':
          description: Unauthorized
