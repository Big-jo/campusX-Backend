  /trending:
    get:
      tags:
        - Trending
      summary: Get trending posts
      description: |
        Retrieve trending posts for a campus using ML-powered topic extraction and engagement scoring.

        **How it works**:
        1. **TF-IDF Topic Extraction**: Analyzes recent posts to identify trending keywords/phrases
        2. **Engagement Scoring**: Posts ranked by formula: `velocity × decay × campus_boost`
           - Velocity = interactions per hour
           - Decay = exponential time decay (24hr half-life)
           - Campus boost = 2x for local trends
        3. **Semantic Grouping**: Groups posts by trending topics using vector similarity
        4. **Pre-computation**: Results pre-computed every 15 minutes via background job
        5. **Caching**: Cached in Redis with 15-minute TTL for <5ms latency

        **Engagement Formula**:
        ```
        interactions = likes - dislikes + (comments × 2)
        velocity = interactions / age_hours
        decay = exp(-age_hours / 24)
        score = velocity × decay × campus_multiplier
        ```

        **Performance**:
        - Cached requests: <5ms latency (99% of requests)
        - Cache miss: ~150ms (rare, only if pre-computation pending)

        **Source field**:
        - `cache`: Served from Redis cache (pre-computed)
        - `ml`: Freshly computed from ML service
        - `error`: Fallback response on error
      operationId: getTrending
      security:
        - bearerAuth: []
      parameters:
        - name: campus
          in: query
          description: Campus identifier (defaults to user's campus if not provided)
          schema:
            type: string
            example: "UNILAG"
        - name: timeWindow
          in: query
          description: Time window for trending calculation
          schema:
            type: string
            enum: ["6h", "24h", "7d"]
            default: "6h"
            example: "6h"
        - name: limit
          in: query
          description: Maximum number of trending topics to return
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
            example: 10
      responses:
        '200':
          description: Trending posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      topics:
                        type: array
                        items:
                          type: object
                          properties:
                            topic:
                              type: string
                              description: Trending keyword or phrase
                              example: "exam preparation"
                            score:
                              type: number
                              description: TF-IDF relevance score
                              example: 0.87
                            posts:
                              type: array
                              description: Full post objects (with author data)
                              items:
                                $ref: '#/components/schemas/Post'
                            hashtags:
                              type: array
                              description: Top 3 hashtags for this topic
                              items:
                                type: string
                              example: ["#exams", "#studytips", "#finals"]
                      total:
                        type: integer
                        description: Total number of posts across all topics
                        example: 25
                      source:
                        type: string
                        description: Data source
                        enum: ["cache", "ml", "error"]
                        example: "cache"
                      computed_at:
                        type: integer
                        description: Unix timestamp when trending was computed
                        example: 1732204800
                      latency_ms:
                        type: integer
                        description: Request latency in milliseconds
                        example: 3
              examples:
                cachedResults:
                  summary: Cached trending posts (typical response)
                  value:
                    success: true
                    data:
                      topics:
                        - topic: "exam preparation"
                          score: 0.87
                          posts:
                            - _id: "507f1f77bcf86cd799439011"
                              author:
                                _id: "507f1f77bcf86cd799439012"
                                name: "John Doe"
                                userTag: "johndoe"
                                avatar: "https://example.com/avatar.jpg"
                              text: "Best exam tips for finals! #exams #studytips"
                              likes: 42
                              comments: 8
                              createdAt: "2025-11-22T10:30:00.000Z"
                          hashtags: ["#exams", "#studytips", "#finals"]
                        - topic: "campus events"
                          score: 0.76
                          posts:
                            - _id: "507f1f77bcf86cd799439013"
                              author:
                                _id: "507f1f77bcf86cd799439014"
                                name: "Jane Smith"
                                userTag: "janesmith"
                              text: "Epic concert tonight! Who's coming? #campuslife"
                              likes: 35
                              comments: 12
                              createdAt: "2025-11-22T09:15:00.000Z"
                          hashtags: ["#campuslife", "#concert", "#events"]
                      total: 25
                      source: "cache"
                      computed_at: 1732204800
