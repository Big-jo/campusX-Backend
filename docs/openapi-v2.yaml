openapi: 3.0.3
info:
  title: CampusX V2 API
  description: API endpoints for posts, newsfeed and related actions (v2)
  version: 2.0.0
servers:
  - url: http://localhost:3001/api/v2
    description: Local development server
  - url: http://localhost:3000
    description: Local development server (alt)
  - url: https://api.campusx.com/api/v2
    description: Production server

tags:
  - name: Posts
    description: Post creation and management endpoints
  - name: Newsfeed
    description: Endpoints for fetching and polling the user's newsfeed
  - name: Users
    description: User profile and follower suggestion endpoints
  - name: Search
    description: ML-powered semantic search endpoints
  - name: Trending
    description: ML-powered trending posts endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Post:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        author:
          type: object
          properties:
            _id:
              type: string
              example: "507f1f77bcf86cd799439012"
            name:
              type: string
              example: "John Doe"
            userTag:
              type: string
              example: "johndoe"
            avatar:
              type: string
              example: "https://example.com/avatar.jpg"
        text:
          type: string
          example: "This is a post! #campuslife"
        image:
          type: string
          nullable: true
          example: "https://s3.amazonaws.com/bucket/image.jpg"
        video:
          type: string
          nullable: true
          example: "https://s3.amazonaws.com/bucket/video.mp4"
        hashTags:
          type: array
          items:
            type: string
          example: ["campuslife", "student"]
        mentions:
          type: array
          items:
            type: string
          example: ["507f1f77bcf86cd799439013"]
        likes:
          type: integer
          example: 42
        comments:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
          example: "2025-11-19T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2025-11-19T10:30:00.000Z"

    Error:
      type: object
      properties:
        message:
          type: string
          example: "Error message"
        statusCode:
          type: integer
          example: 400
        path:
          type: string
          example: "/api/v2/posts/create"
        method:
          type: string
          example: "POST"

    UserProfile:
      type: object
      properties:
        avatar:
          type: string
          example: "https://example.com/avatar.jpg"
        university:
          type: string
          example: "Stanford University"
        rep_points:
          type: integer
          example: 150
        followers:
          type: integer
          example: 42
        bio:
          type: string
          example: "Computer Science student"

    SuggestedUser:
      type: object
      properties:
        user:
          type: object
          properties:
            _id:
              type: string
              example: "507f1f77bcf86cd799439012"
            name:
              type: string
              example: "Jane Doe"
            userTag:
              type: string
              example: "janedoe"
            userProfile:
              $ref: '#/components/schemas/UserProfile'
        score:
          type: number
          format: float
          description: "Composite recommendation score (0.0-1.0)"
          example: 0.85
        mutualFollowers:
          type: integer
          description: "Number of mutual connections"
          example: 5
        reasons:
          type: array
          items:
            type: string
          description: "Reasons for suggestion (e.g., mutual_followers, same_campus)"
          example: ["mutual_followers", "same_campus"]
        activityScore:
          type: number
          format: float
          description: "Activity and reputation score component"
          example: 0.72

    SuggestionsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SuggestedUser'
        meta:
          type: object
          properties:
            total:
              type: integer
              example: 20
            limit:
              type: integer
              example: 20
            offset:
              type: integer
              example: 0
            computedAt:
              type: string
              format: date-time
              example: "2025-11-22T10:30:00.000Z"
            source:
              type: string
              enum: [cache, db]
              description: "Data source (cache=Redis, db=MongoDB)"
              example: "cache"

  responses:
    UnauthorizedError:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "User not authenticated"
            statusCode: 401

    ForbiddenError:
      description: Forbidden - user doesn't have permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Forbidden"
            statusCode: 403

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: "Resource not found"
            statusCode: 404

security:
  - bearerAuth: []

paths:
  /posts/create:
    post:
      tags:
        - Posts
      summary: Create a new post
      description: |
        Create a new post with optional text, images, videos, hashtags, and mentions.
        Supports multipart form data for file uploads.

        At least one of text, image, or video must be provided.
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Post text content
                  maxLength: 5000
                  example: "This is my first post! #campuslife"
                image:
                  type: string
                  format: binary
                  description: Image file to upload (JPEG, PNG, etc.)
                  maxItems: 4 # Updated here
                video:
                  type: string
                  format: binary
                  description: Video file to upload (MP4, MOV, etc.)
                  maxItems: 4 # Updated here
                hashTags:
                  type: array
                  items:
                    type: string
                  description: Array of hashtags (without # symbol)
                  example: ["campuslife", "student"]
                mentions:
                  type: array
                  items:
                    type: string
                  description: Array of user IDs to mention
                  example: ["507f1f77bcf86cd799439011"]
            encoding:
              image:
                contentType: image/jpeg, image/png, image/gif, image/webp
              video:
                contentType: video/mp4, video/quicktime, video/x-msvideo
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post created successfully"
                  postId:
                    type: string
                    example: "507f1f77bcf86cd799439011"
        '400':
          description: Bad request - validation error or missing required content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingContent:
                  summary: Missing content
                  value:
                    message: "Post must have text, image, or video"
                    statusCode: 400
                textTooLong:
                  summary: Text exceeds maximum length
                  value:
                    message: "Text must not exceed 5000 characters"
                    statusCode: 400
        '401':
          description: Unauthorized - missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "User not authenticated"
                statusCode: 401
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Internal server error"
                statusCode: 500

  /posts: # New endpoint starts here
    get:
      tags:
        - Posts
      summary: Get all posts with filters
      description: Retrieve a paginated list of posts, with optional filtering by type, parent post, circle, or user.
      operationId: getPosts
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of posts to return (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
            example: 50
        - name: skip
          in: query
          description: Number of posts to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: type
          in: query
          description: Type of posts to retrieve. 'post' for top-level posts, 'comment' for replies, 'circlePost' for posts within a specific circle.
          schema:
            type: string
            enum: [post, comment, circlePost]
            example: "post"
        - name: parentPost
          in: query
          description: ID of the parent post for comments
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
        - name: circleID
          in: query
          description: ID of the circle for circle posts
          schema:
            type: string
            example: "507f1f77bcf86cd799439014"
        - name: userId
          in: query
          description: ID of the user whose posts to retrieve
          schema:
            type: string
            example: "507f1f77bcf86cd799439012"
      responses:
        '200':
          description: Posts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /posts/{postId}:
    get:
      tags:
        - Posts
      summary: Get a single post
      operationId: getPost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: ID of the post to retrieve
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Posts
      summary: Delete a post
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: ID of the post to delete
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post deleted successfully"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /posts/{postId}/like:
    post:
      tags:
        - Posts
      summary: Like a post
      operationId: likePost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: ID of the post to like
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post liked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post liked"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Posts
      summary: Unlike a post
      operationId: unlikePost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: ID of the post to unlike
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post unliked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post unliked"
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /posts/{postId}/downvote:
    post:
      tags:
        - Posts
      summary: Downvote a post
      description: Downvote a post and deduct 1 karma point from the post author
      operationId: downvotePost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: ID of the post to downvote
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post downvoted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Post downvoted successfully"
                  data:
                    type: object
                    properties:
                      postId:
                        type: string
                        example: "507f1f77bcf86cd799439011"
                      dislikes:
                        type: integer
                        example: 1
        '400':
          description: Bad request - post already downvoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Post already downvoted"
                statusCode: 400
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Posts
      summary: Remove downvote from a post
      description: Remove downvote and restore 1 karma point to the post author
      operationId: removeDownvote
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: ID of the post to remove downvote from
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Downvote removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Downvote removed successfully"
                  data:
                    type: object
                    properties:
                      postId:
                        type: string
                        example: "507f1f77bcf86cd799439011"
                      dislikes:
                        type: integer
                        example: 0
        '400':
          description: Bad request - post not downvoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Post not downvoted"
                statusCode: 400
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /posts/newsfeed:
    get:
      tags:
        - Posts
      summary: Get user's newsfeed
      description: Retrieve paginated newsfeed with cursor-based pagination
      operationId: getNewsfeed
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of posts to return (max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            example: 20
        - name: cursor
          in: query
          description: Cursor for pagination (timestamp or ID from previous response)
          schema:
            type: string
            example: "1234567890"
      responses:
        '200':
          description: Newsfeed retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  nextCursor:
                    type: string
                    example: "1234567890"
                  hasMore:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /posts/newsfeed/poll:
    get:
      tags:
        - Posts
      summary: Poll for new posts (long polling)
      description: Long polling endpoint for real-time newsfeed updates
      operationId: pollNewsfeed
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          description: Timestamp to poll for posts after
          schema:
            type: integer
            example: 1234567890
        - name: timeout
          in: query
          description: Long polling timeout in seconds (max 60)
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 30
            example: 30
        - name: limit
          in: query
          description: Number of posts to return (max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            example: 20
      responses:
        '200':
          description: New posts available or timeout reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  hasNew:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/{userId}/posts:
    get:
      tags:
        - Posts
      summary: Get user's posts
      description: Retrieve posts created by a specific user
      operationId: getUserPosts
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
        - name: type
          in: query
          description: Type of posts to retrieve
          schema:
            type: string
            enum: [all, posts, comments]
            default: all
            example: "all"
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of posts per page (max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            example: 20
      responses:
        '200':
          description: User posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  total:
                    type: integer
                    example: 100
                  page:
                    type: integer
                    example: 1
                  totalPages:
                    type: integer
                    example: 5
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users/suggestions:
    get:
      tags:
        - Users
      summary: Get follower suggestions
      description: |
        Retrieve personalized follower suggestions using a Friends-of-Friends (FoF) recommendation algorithm.

        **Algorithm Overview**:
        The suggestions are computed using a multi-factor scoring system:

        1. **Friends-of-Friends (40% weight)**
           - Analyzes mutual connections to find users followed by people you follow
           - Higher mutual connection count = higher FoF score
           - Normalized against maximum mutual connections

        2. **Campus Affinity (30% weight)**
           - Prioritizes users from the same university
           - Same campus: 1.0 score
           - Different campus: 0.5 score

        3. **Activity × Reputation (30% weight)**
           - Combines recent activity (lastSeen) with reputation points (rep_points)
           - Recency score decays over 30-day period: 1 / (1 + days/30)
           - Activity score = (recencyScore × repPoints) / maxRepPoints

        **Final Score** = 0.4×FoF + 0.3×Campus + 0.3×Activity

        **Caching Strategy**:
        - Top 20 suggestions cached in Redis (15 min TTL)
        - Top 50 suggestions persisted in MongoDB (15 day TTL)
        - Use `refresh=true` to force recomputation

        **Performance**:
        - First request (offset=0): Checks Redis cache, falls back to MongoDB
        - Subsequent pages: Fetched from MongoDB
        - If no suggestions exist, automatically computes on first request
      operationId: getFollowerSuggestions
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of suggestions to return (max 50)
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
            example: 20
        - name: offset
          in: query
          description: Number of suggestions to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: refresh
          in: query
          description: Force recomputation of suggestions (ignores cache)
          schema:
            type: boolean
            default: false
            example: false
      responses:
        '200':
          description: Suggestions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionsResponse'
              examples:
                withSuggestions:
                  summary: Successful response with suggestions
                  value:
                    success: true
                    data:
                      - user:
                          _id: "507f1f77bcf86cd799439012"
                          name: "Jane Doe"
                          userTag: "janedoe"
                          userProfile:
                            avatar: "https://example.com/avatar.jpg"
                            university: "Stanford University"
                            rep_points: 150
                            followers: 42
                            bio: "CS student"
                        score: 0.85
                        mutualFollowers: 5
                        reasons: ["mutual_followers", "same_campus"]
                        activityScore: 0.72
                      - user:
                          _id: "507f1f77bcf86cd799439013"
                          name: "John Smith"
                          userTag: "johnsmith"
                          userProfile:
                            avatar: "https://example.com/avatar2.jpg"
                            university: "MIT"
                            rep_points: 200
                            followers: 68
                            bio: "AI researcher"
                        score: 0.78
                        mutualFollowers: 3
                        reasons: ["mutual_followers", "connected_campus"]
                        activityScore: 0.85
                    meta:
                      total: 20
                      limit: 20
                      offset: 0
                      computedAt: "2025-11-22T10:30:00.000Z"
                      source: "cache"
                emptyResponse:
                  summary: No suggestions available (new user)
                  value:
                    success: true
                    data: []
                    meta:
                      total: 0
                      limit: 20
                      offset: 0
                      computedAt: "2025-11-22T10:30:00.000Z"
                      source: "db"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Failed to compute suggestions"
                statusCode: 500

  /search:
    get:
      tags:
        - Search
      summary: Semantic search for posts
      description: |
        Search posts using ML-powered semantic search with vector embeddings.

        **How It Works**:
        1. Query is converted to a 384-dimensional embedding using Sentence Transformers
        2. Vector similarity search performed in Qdrant vector database
        3. Results ranked by semantic relevance (cosine similarity)
        4. Posts enriched with author details from MongoDB

        **Features**:
        - Semantic understanding (finds related content, not just keyword matches)
        - Campus filtering
        - Interest-based filtering
        - Time window filtering (e.g., posts from last 24 hours)
        - Redis caching (5-minute TTL) for performance
        - Automatic fallback to MongoDB text search if ML service unavailable

        **Performance**:
        - ML search: ~80-100ms
        - Cached results: <5ms
        - Fallback (text search): ~80ms

        **Examples**:
        - "machine learning" will find posts about AI, neural networks, deep learning
        - "exam stress" will find posts about finals anxiety, test preparation
        - "campus events" will find posts about activities, gatherings, socials
      operationId: semanticSearch
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (minimum 2 characters)
          schema:
            type: string
            minLength: 2
            maxLength: 200
            example: "machine learning courses"
        - name: campus
          in: query
          description: Filter by campus (defaults to user's campus)
          schema:
            type: string
            example: "UNILAG"
        - name: limit
          in: query
          description: Number of results to return (max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: interests
          in: query
          description: Comma-separated list of interests to filter by
          schema:
            type: string
            example: "Technology,Education,Sports"
        - name: hours
          in: query
          description: Time window in hours (only show posts from last N hours)
          schema:
            type: integer
            minimum: 1
            example: 24
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      posts:
                        type: array
                        items:
                          $ref: '#/components/schemas/Post'
                      total:
                        type: integer
                        description: Number of results found
                        example: 15
                      source:
                        type: string
                        enum: [ml, cache, fallback]
                        description: |
                          Data source:
                          - ml: Vector search from ML service
                          - cache: Cached results from Redis
                          - fallback: MongoDB text search (ML service unavailable)
                        example: "ml"
                      latency_ms:
                        type: integer
                        description: Search latency in milliseconds
                        example: 87
              examples:
