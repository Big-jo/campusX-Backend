run.config:
  engine: nodejs
  engine.config: 
    version: 14.15.1
  cache_dirs:
    - node_modules
  extra_steps:
  - npm install 
  - npm install -g pm2
  - npm run build

web.site:
  nginx: nginx -c /app/config/nginx.conf
  start: pm2 start npm -- start

extra_packages:
    - nginx

