version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: campusx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - campusx-network

  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusx-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/campusx
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASS=${REDIS_PASS:-}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - VISITED_CIRCLE_EXP_TIME=${VISITED_CIRCLE_EXP_TIME:-24}
      - VISITED_CIRCLE_EXP_UNI=${VISITED_CIRCLE_EXP_UNI:-hours}
      - POST_EXPIRE=${POST_EXPIRE:-7}
      - POST_EXPIRE_UNIT=${POST_EXPIRE_UNIT:-days}
      - CAMPUS_T_EXPIRY_TIME=${CAMPUS_T_EXPIRY_TIME:-1}
      - CAMPUS_T_EXPIRY_UNIT=${CAMPUS_T_EXPIRY_UNIT:-hour}
      - CAMPUS_T_CLEANUP_INTERVAL=${CAMPUS_T_CLEANUP_INTERVAL:-3600000}
      - VISITED_CIRCLE_CLEAN_UP_INTERVAL=${VISITED_CIRCLE_CLEAN_UP_INTERVAL:-86400000}
      - TIMELINE_CLEAN_UP_INTERVAL=${TIMELINE_CLEAN_UP_INTERVAL:-3600000}
      - SPACES_ACCESS_KEY=${SPACES_ACCESS_KEY}
      - SPACES_SECRET=${SPACES_SECRET}
      - SPACES_BUCKET_AVATAR=${SPACES_BUCKET_AVATAR}
      - SPACES_BUCKET_IMAGE=${SPACES_BUCKET_IMAGE}
      - SPACES_BUCKET_VIDEO=${SPACES_BUCKET_VIDEO}
      - SPACES_BUCKET_EXPRESSIONS=${SPACES_BUCKET_EXPRESSIONS}
      - SPACES_BUCKET_CIRCLE_AVATAR=${SPACES_BUCKET_CIRCLE_AVATAR}
      - SPACES_BUCKET_CIRCLE_COVER_IMAGE=${SPACES_BUCKET_CIRCLE_COVER_IMAGE}
      - DSN=${DSN}
      - SMTP_HOST=${SMTP_HOST}
      - SMPT_PORT=${SMPT_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - campusx-network
    volumes:
      - app-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Database
  mongodb:
    image: mongo:5.0
    container_name: campusx-mongodb
    restart: unless-stopped
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_DATABASE=campusx
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - campusx-network
    command: mongod --logpath /dev/null

  # Redis Instance
  redis:
    image: redis:7-alpine
    container_name: campusx-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - campusx-network
    command: redis-server --appendonly yes --appendfsync everysec

networks:
  campusx-network:
    driver: bridge

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local
  app-data:
    driver: local
