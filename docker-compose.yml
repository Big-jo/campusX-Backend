version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: campusx-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
    networks:
      - campusx-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: campusx-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    volumes:
      - redis_data:/data
    networks:
      - campusx-network

  # Core Service (Node.js/TypeScript)
  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: campusx-core
    restart: unless-stopped
    ports:
      - "${CORE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/${MONGO_DB:-campusx}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    networks:
      - campusx-network

  # Scraper Service (Python/Celery)
  scraper:
    build:
      context: ./services/scraper
      dockerfile: Dockerfile
    container_name: campusx-scraper
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: 1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-password}@redis:6379/0
      MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/${MONGO_DB:-campusx}?authSource=admin
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    networks:
      - campusx-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  campusx-network:
    driver: bridge
