version: "1" # Blueprint spec version

services:
  # -------------------------
  # Backend Application
  # -------------------------
  - type: web # Service type: web service with public URL
    name: campusx-backend # Unique service identifier
    runtime: docker # Build from Dockerfile in repo
    region: frankfurt # Deploy region
    plan: starter # Instance size/pricing tier
    dockerfilePath: ./Dockerfile # Path to Dockerfile
    envVars: # Environment variables (array format)
      - key: NODE_ENV # Variable name
        value: production # Hardcoded value
      - key: PORT
        value: 3000
      - key: MONGO_HOST # Get MongoDB hostname from private service
        fromService:
          name: campusx-mongodb # Service name to reference
          type: pserv # Service type
          property: host # Internal hostname
      - key: MONGO_PORT # MongoDB port (always 27017)
        value: "27017"
      - key: MONGO_DB # Database name
        value: campusx
      - key: REDIS_HOST # Get Redis hostname from private service
        fromService:
          name: campusx-redis
          type: pserv
          property: host # Internal hostname
      - key: REDIS_PORT # Get Redis port from private service
        fromService:
          name: campusx-redis
          type: pserv
          property: port # Internal port
      - key: JWT_SECRET # Secret value
        sync: false # Prompt for value in Render dashboard on deploy
      - key: VISITED_CIRCLE_EXP_TIME
        value: "24"
      - key: VISITED_CIRCLE_EXP_UNI
        value: "hours"
      - key: POST_EXPIRE
        value: "7"
      - key: POST_EXPIRE_UNIT
        value: "days"
      - key: CAMPUS_T_EXPIRY_TIME
        value: "1"
      - key: CAMPUS_T_EXPIRY_UNIT
        value: "hour"
      - key: CAMPUS_T_CLEANUP_INTERVAL
        value: "3600000"
      - key: VISITED_CIRCLE_CLEAN_UP_INTERVAL
        value: "86400000"
      - key: TIMELINE_CLEAN_UP_INTERVAL
        value: "3600000"
      - key: SPACES_ACCESS_KEY # DigitalOcean Spaces credentials
        sync: false
      - key: SPACES_SECRET
        sync: false
      - key: SPACES_BUCKET_AVATAR # Bucket names
        sync: false
      - key: SPACES_BUCKET_IMAGE
        sync: false
      - key: SPACES_BUCKET_VIDEO
        sync: false
      - key: SPACES_BUCKET_EXPRESSIONS
        sync: false
      - key: SPACES_BUCKET_CIRCLE_AVATAR
        sync: false
      - key: SPACES_BUCKET_CIRCLE_COVER_IMAGE
        sync: false
      - key: DSN # Sentry DSN for error tracking
        sync: false
      - key: SMTP_HOST # Email service config
        sync: false
      - key: SMPT_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
    disk: # Persistent storage
      name: uploads # Disk identifier
      mountPath: /app/uploads # Container mount path
      sizeGB: 5 # Disk size in GB

  # -------------------------
  # MongoDB Private Service
  # -------------------------
  - type: pserv # Private service (internal network only)
    name: campusx-mongodb # Service identifier
    runtime: image # Deploy pre-built Docker image
    image:
      url: mongo:5.0 # Docker Hub image (full: docker.io/library/mongo:5.0)
    region: frankfurt # Deploy region (must match web service)
    plan: starter # Instance size
    dockerCommand: "mongod --logpath /dev/null" # Override image CMD
    disk: # Persistent storage for MongoDB data
      name: mongodb-data # Disk identifier
      mountPath: /data/db # MongoDB data directory
      sizeGB: 5 # Disk size
    envVars:
      - key: MONGO_INITDB_DATABASE # Initialize default database
        value: campusx

  # -------------------------
  # Redis Private Service
  # -------------------------
  - type: pserv # Private service (internal network only)
    name: campusx-redis # Service identifier
    runtime: image # Deploy pre-built Docker image
    image:
      url: redis:7-alpine # Docker Hub image (Alpine Linux variant)
    region: frankfurt # Deploy region (must match web service)
    plan: starter # Instance size
    dockerCommand: "redis-server --appendonly yes --appendfsync everysec" # Enable AOF persistence
    disk: # Persistent storage for Redis data
      name: redis-data # Disk identifier
      mountPath: /data # Redis data directory
      sizeGB: 2 # Disk size

